name: Feature request
description: Propose a feature or improvement for JailOpsSim.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: Describe the training workflow you want to improve. Use fictional examples and preserve existing features, records, accounts, and deployment support.
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: Who needs this, in which module or workflow, and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what someone should be able to do and the expected result.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes that would show the work is complete.
      placeholder: "- [ ] An operator can ...\n- [ ] Existing ... continues to work."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
      description: Include workarounds, related issues, or sketches using fictional training data.
